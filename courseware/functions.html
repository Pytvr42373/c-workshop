<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>函数传参 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a;
    --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00e676; --cyan: #00e5ff; --orange: #ff9100;
    --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --cell-bg: #1a1d3a; --cell-border: #2a2d5a;
  }

  body {
    font-size: 18px;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .top-bar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .top-bar h1 {
    font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(135deg, var(--pink), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .next-link { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .next-link a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .next-link a:hover { border-color: var(--accent); color: var(--text); }
  .next-link a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .workspace {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action {
    font-size: 0.72rem; color: var(--accent2); cursor: pointer;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(108,92,231,0.1); border: none; font-family: inherit;
  }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }

  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
    line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px;
  }
  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .fn { color: var(--green); font-weight: 600; }
  .code-block .highlight { background: rgba(108,92,231,0.2); border-radius: 3px; padding: 0 2px; }

  .memory-grid {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 12px; background: rgba(0,0,0,0.2);
    border-radius: 8px; min-height: 60px; align-content: flex-start;
  }

  .mem-cell {
    width: 48px; height: 48px;
    background: var(--cell-bg); border: 1px solid var(--cell-border);
    border-radius: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    transition: all 0.3s; position: relative; cursor: pointer;
  }
  .mem-cell .val { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .mem-cell .addr { font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
  .mem-cell .varname { font-size: 0.55rem; color: var(--accent2); margin-bottom: 2px; }
  .mem-cell.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,92,231,0.3); }
  .mem-cell.stack-frame { border-color: var(--pink); background: rgba(255,64,129,0.05); }
  .mem-cell.param-cell { border-color: var(--orange); background: rgba(255,145,0,0.05); }
  .mem-cell.ptr-param { border-color: var(--cyan); background: rgba(0,229,255,0.05); }

  .mem-cell .tooltip {
    display: none; position: absolute;
    bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
    font-size: 0.65rem; color: var(--text); white-space: nowrap; z-index: 10;
  }
  .mem-cell:hover .tooltip { display: block; }

  .frame-label {
    width: 100%;
    text-align: center;
    font-size: 0.65rem;
    color: var(--pink);
    font-family: 'JetBrains Mono', monospace;
    padding: 4px 0;
    margin-bottom: 4px;
    border-bottom: 1px dashed rgba(255,64,129,0.3);
  }

  .frame-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px dashed rgba(255,64,129,0.2);
    border-radius: 8px;
    background: rgba(255,64,129,0.03);
  }

  .var-selector {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .var-btn {
    padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .var-btn:hover { border-color: var(--accent); }
  .var-btn.active { border-color: var(--pink); background: rgba(255,64,129,0.1); }

  .step-controls {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .step-btn {
    padding: 8px 20px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .step-btn:hover { border-color: var(--accent); }
  .step-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step-btn.primary:hover { box-shadow: 0 0 16px rgba(108,92,231,0.3); }

  .info-bar {
    display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap;
  }
  .info-item {
    padding: 6px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.2);
    font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .info-item strong { color: var(--accent2); font-weight: 600; }

  .legend {
    display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--cell-border); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .mem-cell { animation: fadeIn 0.3s ease both; }

  code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--orange); background: rgba(255,145,0,0.08); padding: 1px 6px; border-radius: 4px; }
  /* ===== Light theme ===== */
  [data-theme="light"] {
    --bg: #f0f4ff; --surface: #ffffff; --surface2: #e8edf5; --border: #d0d8e8;
    --accent: #5b4bd4; --accent2: #7c6df0; --green: #00b86b; --cyan: #0099cc;
    --orange: #e67e00; --pink: #d6336c; --red: #d93025; --yellow: #c49000;
    --text: #1a1d3a; --text-dim: #3a3d5a; --py: #b8860b; --cpp: #00599c;
    --cell-bg: #eef2fa; --cell-border: #cdd6e6;
  }
  [data-theme="light"] code { background: rgba(230,126,0,0.06); }
  [data-theme="light"] .tip-box { background: rgba(0,153,204,0.06); border-color: rgba(0,153,204,0.16); }
  [data-theme="light"] .danger-box { background: rgba(217,48,37,0.05); border-color: rgba(217,48,37,0.16); }
  [data-theme="light"] .term:hover { background: rgba(91,75,212,0.08); }
  [data-theme="light"] .term-card { box-shadow: 0 8px 32px rgba(91,75,212,0.17); }
  [data-theme="light"] .hw-diagram, [data-theme="light"] .mem-vis,
  [data-theme="light"] .memory-grid, [data-theme="light"] .mem-strip { background: rgba(0,0,0,0.04); }
  [data-theme="light"] .topic-btn.active { background: rgba(91,75,212,0.10); }

</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>函数传参</h1>
  <span class="sub">值传递 vs 指针传递</span>

  <button id="theme-toggle" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem;color:var(--text-dim);transition:all 0.2s;" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <button class="action" onclick="resetExample()">重置</button>
    </div>
    <div class="panel-body">
      <div class="var-selector" id="var-selector"></div>
      <div class="code-block" id="code-display"></div>
      <div class="step-controls">
        <button class="step-btn primary" onclick="stepForward()">▶ 下一步</button>
        <button class="step-btn" onclick="stepBack()">◀ 上一步</button>
        <span style="font-size:0.72rem;color:var(--text-dim);margin-left:auto;align-self:center" id="step-indicator">步骤 0/0</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">内存视图</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">观察参数传递</span>
    </div>
    <div class="panel-body">
      <div class="memory-grid" id="memory-grid"></div>
      <div class="info-bar" id="info-bar"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="border-color:var(--pink);background:rgba(255,64,129,0.05)"></div> main 栈帧</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--orange);background:rgba(255,145,0,0.05)"></div> 函数参数（副本）</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--cyan);background:rgba(0,229,255,0.05)"></div> 指针参数</div>
      </div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  {
    name: '值传递',
    code: `void swap(int x, int y) {\n    int t = x;\n    x = y;\n    y = t;\n}\n\nint main() {\n    int a = 3, b = 5;\n    swap(a, b);\n    // a=3, b=5 (没变！)\n    return 0;\n}`,
    steps: [
      { desc: '<code>main</code>: <code>a=3</code>, <code>b=5</code>', main: { a: 3, b: 5 }, params: null, local: null },
      { desc: '调用 <code>swap(a,b)</code>，复制参数', main: { a: 3, b: 5 }, params: { x: 3, y: 5 }, local: null },
      { desc: '<code>swap</code>: <code>t=x</code> → <code>t=3</code>', main: { a: 3, b: 5 }, params: { x: 3, y: 5 }, local: { t: 3 } },
      { desc: '<code>swap</code>: <code>x=y</code> → <code>x=5</code>', main: { a: 3, b: 5 }, params: { x: 5, y: 5 }, local: { t: 3 } },
      { desc: '<code>swap</code>: <code>y=t</code> → <code>y=3</code>', main: { a: 3, b: 5 }, params: { x: 5, y: 3 }, local: { t: 3 } },
      { desc: '<code>swap</code> 结束，a,b 不变！', main: { a: 3, b: 5 }, params: null, local: null }
    ]
  },
  {
    name: '指针传递',
    code: `void swap(int *x, int *y) {\n    int t = *x;\n    *x = *y;\n    *y = t;\n}\n\nint main() {\n    int a = 3, b = 5;\n    swap(&a, &b);\n    // a=5, b=3 (变了！)\n    return 0;\n}`,
    steps: [
      { desc: '<code>main</code>: <code>a=3</code>, <code>b=5</code>', main: { a: 3, b: 5 }, params: null, local: null, ptrs: null },
      { desc: '调用 <code>swap(&amp;a,&amp;b)</code>，传入地址', main: { a: 3, b: 5 }, params: { x: '&a', y: '&b' }, local: null, ptrs: { x: 'a', y: 'b' } },
      { desc: '<code>swap</code>: <code>t=*x</code> → <code>t=3</code>', main: { a: 3, b: 5 }, params: { x: '&a', y: '&b' }, local: { t: 3 }, ptrs: { x: 'a', y: 'b' } },
      { desc: '<code>swap</code>: <code>*x=*y</code> → <code>a=5</code>', main: { a: 5, b: 5 }, params: { x: '&a', y: '&b' }, local: { t: 3 }, ptrs: { x: 'a', y: 'b' } },
      { desc: '<code>swap</code>: <code>*y=t</code> → <code>b=3</code>', main: { a: 5, b: 3 }, params: { x: '&a', y: '&b' }, local: { t: 3 }, ptrs: { x: 'a', y: 'b' } },
      { desc: '<code>swap</code> 结束，a,b 交换了！', main: { a: 5, b: 3 }, params: null, local: null, ptrs: null }
    ]
  },
  {
    name: '对比：值 vs 指针',
    code: `void add10(int x) { x += 10; }\nvoid add10p(int *x) { *x += 10; }\n\nint main() {\n    int v = 5;\n    add10(v);    // v 不变\n    add10p(&v);  // v 变了\n    return 0;\n}`,
    steps: [
      { desc: '<code>main</code>: <code>v=5</code>', main: { v: 5 }, params: null, local: null, ptrs: null },
      { desc: '<code>add10(v)</code>: 复制 <code>v=5</code> 给参数', main: { v: 5 }, params: { x: 5 }, local: null },
      { desc: '<code>add10</code>: <code>x+=10</code> → <code>x=15</code>', main: { v: 5 }, params: { x: 15 }, local: null },
      { desc: '<code>add10</code> 结束，v 还是 5', main: { v: 5 }, params: null, local: null },
      { desc: '<code>add10p(&amp;v)</code>: 传入 v 的地址', main: { v: 5 }, params: { x: '&v' }, local: null, ptrs: { x: 'v' } },
      { desc: '<code>add10p</code>: <code>*x+=10</code> → <code>v=15</code>', main: { v: 15 }, params: { x: '&v' }, local: null, ptrs: { x: 'v' } },
      { desc: '<code>add10p</code> 结束，v 变成 15！', main: { v: 15 }, params: null, local: null, ptrs: null }
    ]
  }
];

let currentIdx = 0;
let currentStep = 0;
let baseAddr = 0x5000;

function renderMemory() {
  const ex = EXAMPLES[currentIdx];
  const step = ex.steps[currentStep];
  const grid = document.getElementById('memory-grid');
  const infoBar = document.getElementById('info-bar');
  const stepInd = document.getElementById('step-indicator');

  grid.innerHTML = '';
  stepInd.textContent = `步骤 ${currentStep + 1}/${ex.steps.length}`;

  let addr = baseAddr;

  // Main frame
  if (step.main) {
    const frame = document.createElement('div');
    frame.className = 'frame-group';
    frame.style.width = '100%';

    const label = document.createElement('div');
    label.className = 'frame-label';
    label.textContent = 'main() 栈帧';
    frame.appendChild(label);

    Object.entries(step.main).forEach(([name, val]) => {
      const cell = document.createElement('div');
      cell.className = 'mem-cell';
      cell.style.width = '48px';

      const vn = document.createElement('div');
      vn.className = 'varname';
      vn.textContent = name;
      cell.appendChild(vn);

      const vv = document.createElement('div');
      vv.className = 'val';
      vv.textContent = val;
      cell.appendChild(vv);

      const ad = document.createElement('div');
      ad.className = 'addr';
      ad.textContent = `0x${addr.toString(16).toUpperCase()}`;
      cell.appendChild(ad);

      const tip = document.createElement('div');
      tip.className = 'tooltip';
      tip.textContent = `${name} = ${val}`;
      cell.appendChild(tip);

      frame.appendChild(cell);
      addr += 4;
    });

    grid.appendChild(frame);
  }

  // Params frame
  if (step.params) {
    const frame = document.createElement('div');
    frame.className = 'frame-group';
    frame.style.width = '100%';

    const label = document.createElement('div');
    label.className = 'frame-label';
    label.textContent = '函数参数（新栈帧）';
    label.style.color = 'var(--orange)';
    label.style.borderColor = 'rgba(255,145,0,0.3)';
    frame.appendChild(label);

    Object.entries(step.params).forEach(([name, val]) => {
      const isPtr = step.ptrs && step.ptrs[name];
      const cell = document.createElement('div');
      cell.className = `mem-cell ${isPtr ? 'ptr-param' : 'param-cell'}`;
      cell.style.width = '48px';

      const vn = document.createElement('div');
      vn.className = 'varname';
      vn.textContent = name;
      cell.appendChild(vn);

      const vv = document.createElement('div');
      vv.className = 'val';
      if (isPtr) {
        vv.textContent = `0x${(baseAddr).toString(16).toUpperCase()}`;
        vv.style.color = 'var(--cyan)';
      } else {
        vv.textContent = val;
      }
      cell.appendChild(vv);

      const ad = document.createElement('div');
      ad.className = 'addr';
      ad.textContent = `0x${addr.toString(16).toUpperCase()}`;
      cell.appendChild(ad);

      const tip = document.createElement('div');
      tip.className = 'tooltip';
      if (isPtr) {
        tip.textContent = `${name} 是指针，指向 ${step.ptrs[name]}`;
      } else {
        tip.textContent = `${name} = ${val} (副本)`;
      }
      cell.appendChild(tip);

      frame.appendChild(cell);
      addr += 8;
    });

    // Local vars
    if (step.local) {
      Object.entries(step.local).forEach(([name, val]) => {
        const cell = document.createElement('div');
        cell.className = 'mem-cell';
        cell.style.width = '48px';

        const vn = document.createElement('div');
        vn.className = 'varname';
        vn.textContent = name;
        cell.appendChild(vn);

        const vv = document.createElement('div');
        vv.className = 'val';
        vv.textContent = val;
        cell.appendChild(vv);

        const ad = document.createElement('div');
        ad.className = 'addr';
        ad.textContent = `0x${addr.toString(16).toUpperCase()}`;
        cell.appendChild(ad);

        const tip = document.createElement('div');
        tip.className = 'tooltip';
        tip.textContent = `${name} = ${val} (局部变量)`;
        cell.appendChild(tip);

        frame.appendChild(cell);
        addr += 4;
      });
    }

    grid.appendChild(frame);
  }

  // Info
  infoBar.innerHTML = `
    <div class="info-item">${step.desc}</div>
    <div class="info-item">模式: <strong>${ex.name}</strong></div>
  `;
}

function stepForward() {
  const ex = EXAMPLES[currentIdx];
  if (currentStep < ex.steps.length - 1) {
    currentStep++;
    renderMemory();
  }
}

function stepBack() {
  if (currentStep > 0) {
    currentStep--;
    renderMemory();
  }
}

function resetExample() {
  currentStep = 0;
  renderMemory();
}

function selectExample(idx) {
  currentIdx = idx;
  currentStep = 0;
  const selector = document.getElementById('var-selector');
  const codeDisplay = document.getElementById('code-display');

  selector.querySelectorAll('.var-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  const ex = EXAMPLES[idx];
  codeDisplay.innerHTML = ex.code
    .replace(/\b(void|int)\b/g, '<span class="type">$1</span>')
    .replace(/\b(swap|add10|add10p|main)\b/g, '<span class="fn">$1</span>')
    .replace(/\/\/.*/g, m => `<span class="comment">${m}</span>`);

  renderMemory();
}

function init() {
  const selector = document.getElementById('var-selector');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'var-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    selector.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>

  </div>

<script>
(function() {
  const key = 'c-workshop-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('c-workshop-theme', 'dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('c-workshop-theme', 'light');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}
</script>
