<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII 码与字符 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff; --orange: #ff9100; --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa; --red: #ff4757; --py: #f7df1e; }
  body { font-size: 18px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--green), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .workspace { max-width: 1100px; margin: 0 auto; }
  .topic-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .topic-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .topic-btn:hover { border-color: var(--accent); }
  .topic-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }
  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-body { padding: 20px; }
  .tip-box { padding: 14px 18px; background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
  .tip-box .tip-text strong { color: var(--text); }
  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
  .term { border-bottom: 2px dotted var(--accent2); cursor: help; color: var(--accent2); font-weight: 600; position: relative; }
  .term:hover { background: rgba(108,92,231,0.12); border-radius: 3px; }
  .term-card { position: fixed; z-index: 9999; width: 340px; max-width: 90vw; background: var(--surface2); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(108,92,231,0.25); display: none; pointer-events: none; }
  .term-card.show { display: block; animation: termFadeIn 0.18s ease-out; }
  @keyframes termFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .term-card .tc-title { font-size: 0.82rem; font-weight: 700; color: var(--cyan); margin-bottom: 6px; }
  .term-card .tc-body { font-size: 0.8rem; color: var(--text-dim); line-height: 1.7; }
  .term-card .tc-body strong { color: var(--text); }
  .term-card .tc-body code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--orange); background: rgba(255,145,0,0.08); padding: 1px 5px; border-radius: 3px; }
  .term-card .tc-icon { font-size: 1.1rem; margin-bottom: 4px; }
  .next-link { display: flex; justify-content: space-between; margin-top: 24px; }
  .next-link a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .next-link a:hover { border-color: var(--accent); color: var(--text); }
  .next-link a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .ascii-table { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; }
  .ascii-cell { padding: 6px 4px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2); text-align: center; transition: all 0.3s; cursor: pointer; }
  .ascii-cell:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .ascii-cell .ac-char { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: var(--green); }
  .ascii-cell .ac-code { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; line-height: 1.8; white-space: pre; overflow-x: auto; color: var(--text); background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; }
  .code-block .kw { color: var(--accent2); } .code-block .str { color: var(--green); } .code-block .comment { color: var(--text-dim); font-style: italic; } .code-block .num { color: var(--orange); } .code-block .type { color: var(--cyan); }

  /* ===== Light theme ===== */
  [data-theme="light"] {
    --bg: #f0f4ff; --surface: #ffffff; --surface2: #e8edf5; --border: #d0d8e8;
    --accent: #5b4bd4; --accent2: #7c6df0; --green: #00b86b; --cyan: #0099cc;
    --orange: #e67e00; --pink: #d6336c; --red: #d93025; --yellow: #c49000;
    --text: #1a1d3a; --text-dim: #3a3d5a; --py: #b8860b; --cpp: #00599c;
    --cell-bg: #eef2fa; --cell-border: #cdd6e6;
  }
  [data-theme="light"] .tip-box { background: rgba(0,153,204,0.06); border-color: rgba(0,153,204,0.16); }
  [data-theme="light"] .danger-box { background: rgba(217,48,37,0.05); border-color: rgba(217,48,37,0.16); }
  [data-theme="light"] .term:hover { background: rgba(91,75,212,0.08); }
  [data-theme="light"] .term-card { box-shadow: 0 8px 32px rgba(91,75,212,0.17); }
  [data-theme="light"] .hw-diagram, [data-theme="light"] .mem-vis,
  [data-theme="light"] .memory-grid, [data-theme="light"] .mem-strip { background: rgba(0,0,0,0.04); }
  [data-theme="light"] .topic-btn.active { background: rgba(91,75,212,0.10); }

</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html" class="back-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
  <h1>ASCII 码与字符</h1>
  <span class="sub">'A' = 65 · char 本质是数字 · 字符运算</span>

  <button id="theme-toggle" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem;color:var(--text-dim);transition:all 0.2s;" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>
<div class="workspace">
  <div class="topic-nav" id="topic-nav"></div>
  <div id="content-area"></div>
  <div class="next-link">
    <a href="arrays.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>上一页：数组</a>
    <a href="strings.html">下一页：字符串<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
  </div>
</div>
<script>
const TOPICS = [
  {
    name: 'char 是数字',
    content: `
      <div class="main-grid">
        <div class="panel">
          <div class="panel-header"><span class="label">核心概念</span></div>
          <div class="panel-body">
            <div class="tip-box" style="margin-top:0">
              <div class="tip-label">📌 char 本质是数字</div>
              <div class="tip-text">
                C++ 的 <code>char</code> 类型存的是一个<strong>整数</strong>（0~127），只是显示时被"翻译"成字符。<br><br>
                <code>char c = 65;</code> 和 <code>char c = 'A';</code> <strong>完全等价</strong>。<br>
                因为 'A' 的 <span class="term" data-term="ascii">ASCII 码</span> 就是 65。
              </div>
            </div>
            <div class="danger-box">
              <div class="danger-label">⚠️ Python vs C++ 的区别</div>
              <div class="danger-text">
                <strong>Python</strong>：没有 char 类型。<code>'A'</code> 就是长度为 1 的字符串。<br>
                <strong>C++</strong>：<code>char</code> 是 1 字节整数，和 <code>int</code> 可以互相赋值。
              </div>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="label">代码对比</span></div>
          <div class="panel-body">
            <div class="code-block"><span class="type">char</span> c1 = <span class="str">'A'</span>;    <span class="comment">// 字符'A'</span>
<span class="type">char</span> c2 = <span class="num">65</span>;      <span class="comment">// 数字65，等价于'A'</span>
<span class="type">int</span> x = <span class="str">'A'</span>;      <span class="comment">// x = 65，char转int</span>

<span class="kw">cout</span> &lt;&lt; c1;       <span class="comment">// 输出: A</span>
<span class="kw">cout</span> &lt;&lt; (<span class="type">int</span>)c1;  <span class="comment">// 输出: 65</span>
<span class="kw">cout</span> &lt;&lt; c1 + <span class="num">1</span>;    <span class="comment">// 输出: 66 (B)</span></div>
          </div>
        </div>
      </div>
    `
  },
  {
    name: 'ASCII 表',
    content: `
      <div class="panel">
        <div class="panel-header"><span class="label">常用 ASCII 码（点击查看）</span></div>
        <div class="panel-body">
          <div class="ascii-table" id="ascii-table"></div>
          <div id="ascii-detail" style="margin-top:12px; padding:10px 14px; background:rgba(108,92,231,0.08); border-radius:8px; font-size:0.82rem; color:var(--accent2);">👆 点击字符查看详情</div>
        </div>
      </div>
      <div class="tip-box">
        <div class="tip-label">📌 必须记住的几个</div>
        <div class="tip-text">
          <strong>'0' = 48</strong>（数字零）<br>
          <strong>'A' = 65</strong>（大写A）<br>
          <strong>'a' = 97</strong>（小写a）<br>
          <strong>'\0' = 0</strong>（空字符，字符串结尾）<br><br>
          大写字母 65~90，小写字母 97~122。<br>
          大小写差 32：<code>'a' - 'A' = 32</code>
        </div>
      </div>
    `
  },
  {
    name: '字符运算',
    content: `
      <div class="panel">
        <div class="panel-header"><span class="label">字符可以参与运算！</span></div>
        <div class="panel-body">
          <div class="code-block"><span class="comment">// 大写转小写</span>
<span class="type">char</span> upper = <span class="str">'A'</span>;
<span class="type">char</span> lower = upper + <span class="num">32</span>;  <span class="comment">// 'A'(65) + 32 = 97 = 'a'</span>
<span class="kw">cout</span> &lt;&lt; lower;  <span class="comment">// 输出: a</span>

<span class="comment">// 小写转大写</span>
<span class="type">char</span> c = <span class="str">'z'</span>;
<span class="type">char</span> C = c - <span class="num">32</span>;    <span class="comment">// 'z'(122) - 32 = 90 = 'Z'</span>

<span class="comment">// 数字字符转整数</span>
<span class="type">char</span> digit = <span class="str">'7'</span>;
<span class="type">int</span> val = digit - <span class="str">'0'</span>;  <span class="comment">// '7'(55) - '0'(48) = 7</span>

<span class="comment">// 遍历字母</span>
<span class="kw">for</span> (<span class="type">char</span> c = <span class="str">'A'</span>; c &lt;= <span class="str">'Z'</span>; c++) {
    <span class="kw">cout</span> &lt;&lt; c &lt;&lt; <span class="str">" "</span>;  <span class="comment">// A B C ... Z</span>
}</div>
        </div>
      </div>
      <div class="tip-box">
        <div class="tip-label">📌 竞赛中常用</div>
        <div class="tip-text">
          ① 大小写转换：<code>c + 32</code> 或 <code>c - 32</code>（也可以用 <code>tolower()</code> / <code>toupper()</code>）<br>
          ② 字符转数字：<code>c - '0'</code>（把 '7' 变成 7）<br>
          ③ 数字转字符：<code>n + '0'</code>（把 7 变成 '7'）<br>
          ④ 判断字母：<code>if (c &gt;= 'A' &amp;&amp; c &lt;= 'Z')</code>
        </div>
      </div>
    `
  }
];

let currentIdx = 0;

function renderTopic(idx) {
  const topic = TOPICS[idx];
  document.querySelectorAll('.topic-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('content-area').innerHTML = topic.content;
  if (idx === 1) initAsciiTable();
  initTerms();
}

function initAsciiTable() {
  const container = document.getElementById('ascii-table');
  if (!container) return;
  const entries = [
    ['0', 48], ['1', 49], ['2', 50], ['3', 51], ['4', 52], ['5', 53], ['6', 54], ['7', 55],
    ['8', 56], ['9', 57], [':', 58], [';', 59], ['<', 60], ['=', 61], ['>', 62], ['?', 63],
    ['@', 64], ['A', 65], ['B', 66], ['C', 67], ['D', 68], ['E', 69], ['F', 70], ['G', 71],
    ['H', 72], ['I', 73], ['J', 74], ['K', 75], ['L', 76], ['M', 77], ['N', 78], ['O', 79],
    ['P', 80], ['Q', 81], ['R', 82], ['S', 83], ['T', 84], ['U', 85], ['V', 86], ['W', 87],
    ['X', 88], ['Y', 89], ['Z', 90], ['[', 91], ['\\', 92], [']', 93], ['^', 94], ['_', 95],
    ['`', 96], ['a', 97], ['b', 98], ['c', 99], ['d', 100], ['e', 101], ['f', 102], ['g', 103],
    ['h', 104], ['i', 105], ['j', 106], ['k', 107], ['l', 108], ['m', 109], ['n', 110], ['o', 111],
  ];
  container.innerHTML = '';
  entries.forEach(([ch, code]) => {
    const cell = document.createElement('div');
    cell.className = 'ascii-cell';
    cell.innerHTML = '<div class="ac-char">' + ch + '</div><div class="ac-code">' + code + '</div>';
    cell.onclick = () => {
      document.getElementById('ascii-detail').innerHTML = "字符 <strong>'" + ch + "'</strong> 的 ASCII 码是 <strong>" + code + "</strong>。在 C++ 中 <code>char c = '" + ch + "';</code> 等价于 <code>char c = " + code + ";</code>";
    };
    container.appendChild(cell);
  });
}

function init() {
  const nav = document.getElementById('topic-nav');
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => renderTopic(i);
    nav.appendChild(btn);
  });
  renderTopic(0);
}

const TERM_DEFS = {
  'ascii': { icon: '🔤', title: 'ASCII 码', body: 'American Standard Code for Information Interchange（美国信息交换标准代码）。<br><br>把 128 个常用字符（字母、数字、符号）编号为 0~127。<br><br>计算机底层只存数字，ASCII 就是"字符↔数字"的对照表。' }
};

function initTerms() {
  let ct = null, cc = null;
  function show(t) { if (t===ct&&cc) return; hide(); ct=t; const d=TERM_DEFS[t.dataset.term]; if(!d) return; cc=document.createElement('div'); cc.className='term-card show'; cc.innerHTML='<div class="tc-icon">'+d.icon+'</div><div class="tc-title">'+d.title+'</div><div class="tc-body">'+d.body+'</div>'; document.body.appendChild(cc); const r=t.getBoundingClientRect(); let l=r.left+r.width/2-170, p=r.bottom+8; if(l+340>innerWidth)l=innerWidth-350; if(p+200>innerHeight)p=r.top-208; if(l<10)l=10; cc.style.left=l+'px'; cc.style.top=p+'px'; }
  function hide() { if(cc){cc.remove();cc=null;} ct=null; }
  document.addEventListener('mouseover', e => { const t=e.target.closest('.term'); if(t) show(t); else if(!e.target.closest('.term-card')) hide(); });
}

init();
</script>

<script>
(function() {
  const key = 'c-workshop-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('c-workshop-theme', 'dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('c-workshop-theme', 'light');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}
</script>
</body>
</html>
