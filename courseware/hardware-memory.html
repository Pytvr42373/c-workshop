<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>计算机硬件与内存 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --py: #f7df1e; --red: #ff4757;
  }
  body { font-size: 18px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--cyan), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .next-link { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .next-link a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .next-link a:hover { border-color: var(--accent); color: var(--text); }
  .next-link a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .workspace { max-width: 1100px; margin: 0 auto; }

  .topic-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .topic-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .topic-btn:hover { border-color: var(--accent); }
  .topic-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-body { padding: 20px; }

  .tip-box { padding: 14px 18px; background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
  .tip-box .tip-text strong { color: var(--text); }

  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  .term { border-bottom: 2px dotted var(--accent2); cursor: help; color: var(--accent2); font-weight: 600; position: relative; }
  .term:hover { background: rgba(108,92,231,0.12); border-radius: 3px; }
  .term-card { position: fixed; z-index: 9999; width: 340px; max-width: 90vw; background: var(--surface2); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(108,92,231,0.25); display: none; pointer-events: none; }
  .term-card.show { display: block; animation: termFadeIn 0.18s ease-out; }
  @keyframes termFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .term-card .tc-title { font-size: 0.82rem; font-weight: 700; color: var(--cyan); margin-bottom: 6px; }
  .term-card .tc-body { font-size: 0.8rem; color: var(--text-dim); line-height: 1.7; }
  .term-card .tc-body strong { color: var(--text); }
  .term-card .tc-body code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--orange); background: rgba(255,145,0,0.08); padding: 1px 5px; border-radius: 3px; }
  .term-card .tc-icon { font-size: 1.1rem; margin-bottom: 4px; }

  /* Hardware diagram */
  .hw-diagram { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; }
  .hw-row { display: flex; gap: 12px; align-items: stretch; }
  .hw-block { flex: 1; border-radius: 10px; padding: 16px; text-align: center; border: 2px solid; transition: all 0.3s; cursor: pointer; }
  .hw-block:hover { transform: translateY(-2px); }
  .hw-block .hw-icon { font-size: 2rem; margin-bottom: 8px; }
  .hw-block .hw-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
  .hw-block .hw-desc { font-size: 0.7rem; color: var(--text-dim); line-height: 1.5; }
  .hw-cpu { border-color: var(--accent); background: rgba(108,92,231,0.08); }
  .hw-cpu:hover { border-color: var(--accent2); box-shadow: 0 0 16px rgba(108,92,231,0.2); }
  .hw-ram { border-color: var(--green); background: rgba(0,230,118,0.08); }
  .hw-ram:hover { border-color: var(--green); box-shadow: 0 0 16px rgba(0,230,118,0.2); }
  .hw-disk { border-color: var(--orange); background: rgba(255,145,0,0.08); }
  .hw-disk:hover { border-color: var(--orange); box-shadow: 0 0 16px rgba(255,145,0,0.2); }
  .hw-io { border-color: var(--cyan); background: rgba(0,229,255,0.08); }
  .hw-io:hover { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,0.2); }

  .hw-arrow { text-align: center; color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; }
  .hw-arrow svg { width: 24px; height: 24px; stroke: var(--text-dim); fill: none; stroke-width: 2; }

  /* Memory visualization */
  .mem-label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }

  /* Memory type blocks visualization */
  .mem-wrap { margin-top: 8px; }
  .mem-grid-bar { display: flex; gap: 3px; padding: 14px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 4px; }
  .mem-grid-bar .slot { flex: 1; height: 40px; border-radius: 5px; border: 1px solid rgba(42,45,90,0.5); background: var(--surface2); position: relative; transition: all 0.2s; cursor: default; }
  .mem-grid-bar .slot .slot-num { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; font-size: 0.5rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .mem-grid-bar .slot.used { border-color: transparent; }
  .mem-grid-bar .slot.used .slot-num { color: rgba(255,255,255,0.85); }
  .mem-addr-hint { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 12px; line-height: 1.6; padding: 0 2px; }
  .mem-type-row { display: flex; align-items: center; gap: 14px; padding: 10px 6px; border-bottom: 1px solid rgba(42,45,90,0.35); transition: background 0.2s; }
  .mem-type-row:last-child { border-bottom: none; }
  .mem-type-row:hover { background: rgba(108,92,231,0.06); border-radius: 8px; }
  .mem-type-name { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; font-weight: 700; min-width: 70px; }
  .mem-type-bytes { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); min-width: 48px; }
  .mem-type-blocks { display: flex; gap: 2px; flex: 1; }
  .mem-type-blocks .blk { height: 34px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; transition: transform 0.15s, filter 0.15s; cursor: help; position: relative; }
  .mem-type-blocks .blk .b-num { font-size: 0.62rem; font-weight: 700; color: rgba(255,255,255,0.95); line-height: 1; }
  .mem-type-blocks .blk .b-addr { font-size: 0.5rem; color: rgba(255,255,255,0.7); line-height: 1.2; }
  .mem-type-blocks .blk:hover { transform: translateY(-3px); filter: brightness(1.12); z-index: 2; }
  .mem-card { position: fixed; z-index: 9999; width: 320px; max-width: 90vw; background: var(--surface2); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(108,92,231,0.25); display: none; pointer-events: none; }
  .mem-card.show { display: block; }
  .mem-card .mc-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; }
  .mem-card .mc-body { font-size: 0.78rem; color: var(--text-dim); line-height: 1.7; }
  .mem-card .mc-body strong { color: var(--text); }
  .mem-card .mc-body code { font-family: 'JetBrains Mono', monospace; color: var(--orange); }


  .step-info { margin-top: 10px; padding: 10px 14px; background: rgba(108,92,231,0.08); border-radius: 8px; font-size: 0.85rem; color: var(--accent2); font-family: 'Inter', sans-serif; line-height: 1.5; }

  .compare-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.78rem; }
  .compare-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .compare-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,90,0.5); }
  .compare-table .py-col { color: var(--py); }
  .compare-table .cpp-col { color: var(--cyan); }

  code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--orange); background: rgba(255,145,0,0.08); padding: 1px 6px; border-radius: 4px; }
  /* ===== Light theme ===== */
  [data-theme="light"] {
    --bg: #f0f4ff; --surface: #ffffff; --surface2: #e8edf5; --border: #d0d8e8;
    --accent: #5b4bd4; --accent2: #7c6df0; --green: #00b86b; --cyan: #0099cc;
    --orange: #e67e00; --pink: #d6336c; --red: #d93025; --yellow: #e6a800;
    --text: #1a1d3a; --text-dim: #3a3d5a;
  }
  [data-theme="light"] code { background: rgba(230,126,0,0.06); }
  [data-theme="light"] .topic-btn.active { border-color: var(--accent); background: rgba(91,75,212,0.10); }
  [data-theme="light"] .tip-box { background: rgba(0,153,204,0.05); border-color: rgba(0,153,204,0.12); }
  [data-theme="light"] .danger-box { background: rgba(217,48,37,0.05); border-color: rgba(217,48,37,0.12); }
  [data-theme="light"] .term:hover { background: rgba(91,75,212,0.08); }
  [data-theme="light"] .term-card { box-shadow: 0 8px 32px rgba(91,75,212,0.17); }
  [data-theme="light"] .term-card .tc-body code { background: rgba(230,126,0,0.06); }
  [data-theme="light"] .hw-diagram { background: rgba(0,0,0,0.04); }
  [data-theme="light"] .hw-cpu { background: rgba(91,75,212,0.06); }
  [data-theme="light"] .hw-cpu:hover { border-color: var(--accent2); box-shadow: 0 0 16px rgba(91,75,212,0.14); }
  [data-theme="light"] .hw-ram { background: rgba(0,184,107,0.06); }
  [data-theme="light"] .hw-ram:hover { box-shadow: 0 0 16px rgba(0,184,107,0.14); }
  [data-theme="light"] .hw-disk { background: rgba(230,126,0,0.06); }
  [data-theme="light"] .hw-disk:hover { box-shadow: 0 0 16px rgba(230,126,0,0.14); }
  [data-theme="light"] .hw-io { background: rgba(0,153,204,0.06); }
  [data-theme="light"] .hw-io:hover { box-shadow: 0 0 16px rgba(0,153,204,0.14); }
  [data-theme="light"] .mem-grid-bar { background: rgba(0,0,0,0.04); }
  [data-theme="light"] .mem-card { box-shadow: 0 8px 32px rgba(91,75,212,0.17); }
  [data-theme="light"] .step-info { background: rgba(91,75,212,0.06); }
  [data-theme="light"] .compare-table td { border-bottom-color: rgba(208,216,232,0.7); }

[data-theme="light"] .mem-type-row { border-bottom-color: rgba(208,216,232,0.5); }
[data-theme="light"] .mem-type-row:hover { background: rgba(91,75,212,0.04); }
[data-theme="light"] .mem-grid-bar .slot { border-color: rgba(208,216,232,0.5); }
[data-theme="light"] .step-info { background: rgba(91,75,212,0.06); }
[data-theme="light"] .hw-cpu { background: rgba(91,75,212,0.06); }
[data-theme="light"] .hw-ram { background: rgba(0,184,107,0.06); }
[data-theme="light"] .hw-disk { background: rgba(230,126,0,0.06); }
[data-theme="light"] .hw-io { background: rgba(0,153,204,0.06); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>计算机硬件与内存</h1>
  <span class="sub">CPU · 内存 · 硬盘 · 变量存在哪？</span>

  <button id="theme-toggle" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem;color:var(--text-dim);transition:all 0.2s;" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<div class="workspace">
  <div class="topic-nav" id="topic-nav"></div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="label">图解</span>
        <span style="font-size:0.72rem;color:var(--text-dim)">点击硬件块查看详情</span>
      </div>
      <div class="panel-body">
        <div class="hw-diagram" id="hw-diagram"></div>
        <div class="step-info" id="hw-info">👆 点击上方的硬件模块，了解每个部件的作用</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="label">关键知识</span>
      </div>
      <div class="panel-body" id="knowledge-panel">
        <div id="knowledge-content"></div>
      </div>
    </div>
  </div>

  <div class="next-link">
    <a href="binary-basics.html" style="margin-left:auto;">
      下一页：二进制与数据表示
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>
</div>

<script>
const TOPICS = [
  {
    name: '四大硬件',
    diagram: `
      <div class="hw-row">
        <div class="hw-block hw-cpu" onclick="showHW('cpu')">
          <div class="hw-icon">🧠</div>
          <div class="hw-name">CPU</div>
          <div class="hw-desc">中央处理器<br>负责"思考和计算"</div>
        </div>
        <div class="hw-block hw-ram" onclick="showHW('ram')">
          <div class="hw-icon">⚡</div>
          <div class="hw-name">内存 (RAM)</div>
          <div class="hw-desc">临时存储<br>程序运行时数据</div>
        </div>
      </div>
      <div class="hw-row">
        <div class="hw-block hw-disk" onclick="showHW('disk')">
          <div class="hw-icon">💾</div>
          <div class="hw-name">硬盘</div>
          <div class="hw-desc">永久存储<br>文件、程序</div>
        </div>
        <div class="hw-block hw-io" onclick="showHW('io')">
          <div class="hw-icon">⌨️</div>
          <div class="hw-name">输入/输出</div>
          <div class="hw-desc">键盘、显示器<br>与外界交互</div>
        </div>
      </div>
    `,
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 计算机四大核心部件</div>
        <div class="tip-text">
          <strong>CPU</strong>（中央处理器）：计算机的"大脑"，负责执行指令、做运算。<br><br>
          <strong>内存</strong>（<span class="term" data-term="ram">RAM</span>）：临时存储正在运行的程序和数据。断电即消失。<br><br>
          <strong>硬盘</strong>（SSD/HDD）：永久存储文件、操作系统、程序代码。断电不消失。<br><br>
          <strong>输入/输出设备</strong>：键盘（输入）、显示器（输出）、鼠标等。
        </div>
      </div>
      <div class="tip-box">
        <div class="tip-label">💡 和 Python 的关系</div>
        <div class="tip-text">
          你写 Python 代码时：<br>
          ① 代码文件存在<strong>硬盘</strong>上（<code>.py</code> 文件）<br>
          ② 运行时 Python 解释器把代码加载到<strong>内存</strong>里<br>
          ③ <strong>CPU</strong> 逐行执行内存中的指令<br>
          ④ <code>print()</code> 把结果送到<strong>显示器</strong>（输出设备）<br><br>
          C++ 也一样，只是多了一步"编译"（把 .cpp 翻译成机器码）。
        </div>
      </div>
    `
  },
  {
    name: '内存是什么',
    diagram: `
      <div class="hw-diagram">
        <div class="mem-label">内存格子示意图 — 16 个字节，鼠标放到彩色块上看每种类型占多大</div>
        <div class="mem-wrap">
          <div class="mem-grid-bar" id="mem-grid-bar"></div>
          <div class="mem-addr-hint">↑ 这就是内存，一共 16 个格子（字节）。<strong>每个格子有编号</strong>，从 0 开始数。</div>
          <div id="mem-type-list"></div>
          <div class="mem-card" id="mem-card"></div>
        </div>
      </div>
    `,
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 内存 = 一排带编号的格子</div>
        <div class="tip-text">
          想象内存是一排<strong>信箱</strong>，每个信箱能放一个<strong>字节</strong>的数据。<br>
          左边图里那 16 个格子就是 16 个字节。<br><br>
          <strong>变量</strong>就是占用了一组连续的格子。把鼠标放到右边彩色的类型块上，就能看到它占了几个格子、从哪一号到哪一号。<br>
          比如 <code>int a = 42;</code> 要占 4 个格子，<code>char c = 'A';</code> 只占 1 个格子。
        </div>
      </div>
      <div class="tip-box">
        <div class="tip-label">🔢 格子的编号 — 什么是"地址"</div>
        <div class="tip-text">
          每个格子都有一个<strong>编号</strong>，就像门牌号。这个编号叫<strong>地址</strong>（<span class="term" data-term="address">Address</span>）。<br><br>
          <strong>从 0 开始数</strong>：第一个格子是 0 号，第二个是 1 号，第三个是 2 号…… 和数组的下标一模一样。<br><br>
          你在图里看到的 <code>0</code>、<code>1</code>、<code>2</code> 就是这些编号。<br>
          那为什么有时候会看到 <code>0x00</code>、<code>0x7fff</code> 这种写法？→
          <span class="term" data-term="hexaddr">点这里看讲解</span>
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ Python 和 C++ 的关键区别</div>
        <div class="danger-text">
          <strong>Python</strong>：变量是"标签"，指向对象。你不用管变量存在内存哪里。<br>
          <code>x = 42</code> → Python 帮你分配内存，你只管用名字 <code>x</code>。<br><br>
          <strong>C++</strong>：变量是"信箱"，你声明类型时编译器就分配了固定大小的格子。<br>
          <code>int x = 42;</code> → 编译器分配 4 字节，<code>x</code> 就是那 4 个格子的名字。<br><br>
          这就是为什么 C++ 有<span class="term" data-term="pointer">指针</span>——直接操作地址。
        </div>
      </div>
    `
  },
  {
    name: '程序怎么跑',
    diagram: `
      <div class="hw-diagram">
        <div class="hw-row">
          <div class="hw-block hw-disk" style="flex:1">
            <div class="hw-icon">📄</div>
            <div class="hw-name">源代码</div>
            <div class="hw-desc">hello.cpp<br>存在硬盘上</div>
          </div>
        </div>
        <div class="hw-arrow">↓ 编译（g++）</div>
        <div class="hw-row">
          <div class="hw-block hw-disk" style="flex:1">

let currentIdx = 0;

const HINTS = [
  '👆 点击硬件模块查看详情',
  '鼠标放到彩色块上看每种类型占几个字节',
  '从 .cpp 到输出的完整流程',
  '同样运算量 C++ 快约 60 倍'
];

function renderTopic(idx) {
  const topic = TOPICS[idx];
  document.querySelectorAll('.topic-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('hw-diagram').innerHTML = topic.diagram;
  document.getElementById('hw-info').textContent = HINTS[idx] || '';
  document.getElementById('knowledge-content').innerHTML = topic.knowledge;
  initTerms();
  if (idx === 1) setTimeout(initMemTypes, 50);
}

function showHW(type) {
  const info = {
    cpu: '🧠 CPU（中央处理器）：计算机的"大脑"。你写的每一行代码最终都变成 CPU 指令。CPU 速度极快，但只能处理内存中的数据。',
    ram: '⚡ 内存（RAM）：临时存储。程序运行时，代码和变量都在内存里。断电即消失。C++ 的变量就存在这里。',
    disk: '💾 硬盘：永久存储。你的 .cpp 文件、编译出的 .exe 都存在硬盘。断电不消失。但硬盘比内存慢得多。',
    io: '⌨️ 输入/输出：键盘输入数据到内存，CPU 处理后从内存输出到显示器。cin 从键盘读，cout 到显示器写。'
  };
  document.getElementById('hw-info').textContent = info[type] || '';
  document.querySelectorAll('.hw-block').forEach(b => b.style.opacity = '0.5');
  const el = document.querySelector('[onclick*="' + type + '"]');
  if (el) el.style.opacity = '1';
}

function initMemTypes() {
  const bar = document.getElementById('mem-grid-bar');
  const list = document.getElementById('mem-type-list');
  const card = document.getElementById('mem-card');
  if (!bar || !list) return;

  const TOTAL = 16;

  const TYPES = [
    { name: 'char',  bytes: 1, color: '#ff4081', what: '1 个字符（如 \'A\'）' },
    { name: 'short',  bytes: 2, color: '#a29bfe', what: '较小的整数（-32768~32767）' },
    { name: 'int',    bytes: 4, color: '#00e676', what: '普通整数（约 ±21 亿）' },
    { name: 'long',   bytes: 8, color: '#ff9100', what: '大整数（±9.2×10¹⁸）' },
    { name: 'float',  bytes: 4, color: '#00e5ff', what: '小数（约 7 位有效数字）' },
    { name: 'double', bytes: 8, color: '#ff5252', what: '高精度小数（约 15 位有效数字）' }
  ];

  // --- 顶部 16 格内存条 ---
  bar.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const s = document.createElement('div');
    s.className = 'slot';
    const num = document.createElement('div');
    num.className = 'slot-num';
    num.textContent = i;
    s.appendChild(num);
    bar.appendChild(s);
  }

  // --- 每种类型一行：彩色块铺在 16 格上 ---
  list.innerHTML = TYPES.map(t => {
    let blocks = '';
    for (let i = 0; i < t.bytes; i++) {
      blocks += '<div class="blk" style="background:' + t.color + ';flex:1" ' +
        'data-type="' + t.name + '" data-start="0" data-end="' + (t.bytes - 1) + '">' +
        '<div class="b-num">' + i + '</div>' +
        '<div class="b-addr">号' + i + '</div>' +
        '</div>';
    }
    return '<div class="mem-type-row">' +
      '<div class="mem-type-name" style="color:' + t.color + '">' + t.name + '</div>' +
      '<div class="mem-type-bytes">' + t.bytes + ' 字节</div>' +
      '<div class="mem-type-blocks">' + blocks + '</div>' +
      '</div>';
  }).join('');

  // --- 悬停知识卡 ---
  function showCard(target) {
    const type = target.dataset.type;
    const start = parseInt(target.dataset.start);
    const end = parseInt(target.dataset.end);
    const t = TYPES.find(x => x.name === type);
    if (!t) return;
    card.innerHTML =
      '<div class="mc-title" style="color:' + t.color + '">' + t.name + '（占 ' + t.bytes + ' 字节）</div>' +
      '<div class="mc-body">' +
      '这个类型在内存里要占 <strong>' + t.bytes + ' 个格子</strong>（' + t.bytes + ' 个字节）。<br>' +
      '存放的内容：<strong>' + t.what + '</strong><br>' +
      '从第 <code>' + start + '</code> 号格子到第 <code>' + end + '</code> 号格子，一共 <strong>' + t.bytes + '</strong> 格。<br>' +
      '<br>对比：<code>char</code> 最短（1 格），<code>long</code>/<code>double</code> 最长（8 格）。' +
      '类型越大，能存的数越大/越精确，但更费内存。' +
      '</div>';
    card.classList.add('show');
    const rect = target.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - 160;
    let top = rect.bottom + 8;
    if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
    if (top + 220 > window.innerHeight) top = rect.top - 228;
    if (left < 10) left = 10;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
  }
  function hideCard() { card.classList.remove('show'); }

  list.querySelectorAll('.blk').forEach(el => {
    el.addEventListener('mouseenter', () => showCard(el));
    el.addEventListener('mouseleave', hideCard);
  });
}


function init() {
  const nav = document.getElementById('topic-nav');
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => renderTopic(i);
    nav.appendChild(btn);
  });
  renderTopic(0);
}

// === 专有名词 tooltip ===
const TERM_DEFS = {
  'ram': { icon: '⚡', title: 'RAM（随机存取存储器）', body: '就是"内存"。RAM = Random Access Memory。<br><br>特点是<strong>断电即消失</strong>（易失性），所以你程序运行结束后，变量就没了。<br><br>速度比硬盘快 100~1000 倍，但容量小（通常 8~32 GB）。' },
  'address': { icon: '🏠', title: '地址（Address）', body: '内存里每个格子（字节）都有一个编号，叫<strong>地址</strong>，就像门牌号。<br><br>第一个格子是 0 号，第二个是 1 号…… 从 0 开始数，和数组下标一样。<br><br>变量存在内存里，就是占用了几个连续的格子。CPU 凭地址找到变量、读或改它的值。' },
  'hexaddr': { icon: '🔢', title: '为什么地址写成 0x00？', body: '你有时会看到地址写成 <code>0x00</code>、<code>0x7fff</code> 这种样子。<br><br>其实它就是格子的编号，只是用了<strong>十六进制</strong>来写（逢 16 进 1）。<br><br><code>0x</code> 只是"接下来是十六进制"的标记，就像人民币符号 ¥ 表示"接下来是钱"。<br><br>换算：<code>0x00</code> = 第 0 号，<code>0x04</code> = 第 4 号，<code>0x0A</code> = 第 10 号。<br><br>为什么用十六进制？因为内存地址经常很大（几十亿），用十六进制写更短、更整齐。对你来说，<strong>知道它就是个编号就行</strong>，初学不用纠结换算。' },
  'pointer': { icon: '🎯', title: '指针（Pointer）', body: '存地址的变量。<br><br>普通变量存<strong>值</strong>（如 <code>int a = 42</code>），指针存<strong>地址</strong>（如 <code>int *p = &a</code>，p 存的是 a 的地址）。<br><br>Python 没有指针，因为 Python 帮你管理了所有地址。' },
  'interpreted': { icon: '🐍', title: '解释型语言', body: '运行时逐行翻译代码。Python、JavaScript 都是解释型。<br><br>优点：写完直接跑，方便调试。<br>缺点：每次运行都要翻译，速度慢。' },
  'compiled': { icon: '⚡', title: '编译型语言', body: '运行前先把整个程序翻译成机器码。C、C++、Rust 都是编译型。<br><br>优点：运行速度快（CPU 直接执行）。<br>缺点：每次改代码都要重新编译。' }
};

let TERMS_INITED = false;

function initTerms() {
  if (TERMS_INITED) return;
  TERMS_INITED = true;
  let currentTerm = null, currentCard = null;
  function showCard(term) {
    if (term === currentTerm && currentCard) return;
    hideCard();
    currentTerm = term;
    const key = term.dataset.term;
    const def = TERM_DEFS[key];
    if (!def) return;
    const card = document.createElement('div');
    card.className = 'term-card show';
    card.innerHTML = '<div class="tc-icon">' + def.icon + '</div><div class="tc-title">' + def.title + '</div><div class="tc-body">' + def.body + '</div>';
    document.body.appendChild(card);
    const rect = term.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - 170;
    let top = rect.bottom + 8;
    if (left + 340 > window.innerWidth) left = window.innerWidth - 350;
    if (top + 200 > window.innerHeight) top = rect.top - 208;
    if (left < 10) left = 10;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    currentCard = card;
  }
  function hideCard() {
    if (currentCard) { currentCard.remove(); currentCard = null; }
    currentTerm = null;
  }
  document.addEventListener('mouseover', (e) => {
    const term = e.target.closest('.term');
    if (term) showCard(term);
    else if (!e.target.closest('.term-card')) hideCard();
  });
}

init();
</script>

<script>
(function() {
  const key = 'c-workshop-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('c-workshop-theme', 'dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('c-workshop-theme', 'light');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}
</script>
