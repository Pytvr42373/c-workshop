<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 基础 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a;
    --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00e676; --cyan: #00e5ff; --orange: #ff9100;
    --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --cell-bg: #1a1d3a; --cell-border: #2a2d5a;
  }

  body {
    font-size: 18px;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .top-bar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .top-bar h1 {
    font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(135deg, var(--green), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action {
    font-size: 0.72rem; color: var(--accent2); cursor: pointer;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(108,92,231,0.1); border: none; font-family: inherit;
  }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }

  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
    line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px;
  }
  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.2); border-radius: 3px; padding: 0 2px; }

  .ctrl-btn {
    padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active { border-color: var(--green); background: rgba(0,230,118,0.1); }
  .ctrl-btn.primary { border-color: var(--green); color: var(--green); }

  .container-view {
    display: flex; align-items: center; gap: 10px;
    padding: 14px; background: rgba(0,0,0,0.2); border-radius: 8px; min-height: 70px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .container-label {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim);
    writing-mode: horizontal-tb; margin-right: 4px;
  }
  .elem {
    width: 46px; height: 46px; background: var(--cell-bg); border: 1px solid var(--cell-border);
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 600;
    transition: all 0.3s; position: relative;
  }
  .elem.vec { border-color: var(--cyan); color: var(--cyan); }
  .elem.stack-top { border-color: var(--orange); box-shadow: 0 0 8px rgba(255,145,0,0.2); color: var(--orange); }
  .elem.queue-front { border-color: var(--green); box-shadow: 0 0 8px rgba(0,230,118,0.2); color: var(--green); }
  .elem.queue-back { border-color: var(--orange); box-shadow: 0 0 8px rgba(255,145,0,0.2); color: var(--orange); }
  .elem.empty-msg { border: 1px dashed var(--border); color: var(--text-dim); width: auto; padding: 0 12px; font-size: 0.72rem; background: transparent; }

  .pointer-mark {
    font-size: 0.6rem; color: var(--text-dim); position: absolute; top: -18px;
  }
  .elem .pointer-mark { display: none; }
  .elem.stack-top .pointer-mark, .elem.queue-front .pointer-mark, .elem.queue-back .pointer-mark { display: block; }

  .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .value-input {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; width: 90px; outline: none; transition: border-color 0.2s;
  }
  .value-input:focus { border-color: var(--accent); }

  .info-bar {
    display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap;
  }
  .info-item {
    padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.2);
    font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .info-item strong { color: var(--accent2); font-weight: 600; }

  .legend {
    display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--cell-border); }

  .next-link {
    max-width: 1100px; margin: 40px auto 0; display: flex;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .next-link a {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-dim); text-decoration: none; font-size: 0.8rem;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); transition: all 0.2s;
  }
  .next-link a:hover { border-color: var(--accent); color: var(--text); }
  .next-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* ===== Light theme ===== */
  [data-theme="light"] {
    --bg: #f0f4ff; --surface: #ffffff; --surface2: #e8edf5; --border: #d0d8e8;
    --accent: #5b4bd4; --accent2: #7c6df0; --green: #00b86b; --cyan: #0099cc;
    --orange: #e67e00; --pink: #d6336c; --red: #d93025; --yellow: #c49000;
    --text: #1a1d3a; --text-dim: #3a3d5a; --py: #b8860b; --cpp: #00599c;
    --cell-bg: #eef2fa; --cell-border: #cdd6e6;
  }
  [data-theme="light"] .container-view, [data-theme="light"] .info-item { background: rgba(0,0,0,0.04); }
  [data-theme="light"] .ctrl-btn.active { background: rgba(0,184,107,0.06); }
  [data-theme="light"] .code-block .highlight { background: rgba(91,75,212,0.10); }
  [data-theme="light"] .panel-header .action:hover { background: rgba(91,75,212,0.10); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>STL 基础</h1>
  <span class="sub">vector · stack · queue · sort</span>

  <button id="theme-toggle" style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem;color:var(--text-dim);transition:all 0.2s;" onclick="toggleTheme()" title="切换主题">🌙</button>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">容器可视化</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">点击操作看变化</span>
    </div>
    <div class="panel-body">
      <div id="container-buttons" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>
      <div class="container-view" id="container-view"></div>
      <div class="action-bar">
        <input type="number" class="value-input" id="value-input" value="42" placeholder="值">
        <button class="ctrl-btn primary" id="push-btn" onclick="pushOp()">push / 插入</button>
        <button class="ctrl-btn" id="pop-btn" onclick="popOp()">pop / 弹出</button>
        <button class="ctrl-btn" id="sort-btn" onclick="sortOp()">sort 排序</button>
      </div>
      <div class="info-bar" id="info-bar"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="border-color:var(--cyan);background:rgba(0,229,255,0.2)"></div> vector 元素</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--orange);background:rgba(255,145,0,0.2)"></div> 栈顶 / 队尾</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--green);background:rgba(0,230,118,0.2)"></div> 队首</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">C++ 代码</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">GESP 2-3级 · 提高编码效率</span>
    </div>
    <div class="panel-body">
      <div class="code-block" id="code-display"></div>
    </div>
  </div>
</div>

<script>
const CONTAINERS = ['vector', 'stack', 'queue'];
const CODES = {
  vector: '#include <vector>\nvector<int> v;\nv.push_back(10); // 末尾追加\nv.push_back(20);\nv.pop_back();     // 弹出末尾\nsort(v.begin(), v.end()); // 排序\n// v[0] 下标访问，v.size() 长度',
  stack: '#include <stack>\nstack<int> s;\ns.push(10);   // 压栈（加到顶部）\ns.push(20);\nint t = s.top();  // 只看顶部\ns.pop();      // 弹出顶部\n// LIFO 后进先出',
  queue: '#include <queue>\nqueue<int> q;\nq.push(10);    // 入队（加到队尾）\nq.push(20);\nint f = q.front(); // 队首\nq.pop();       // 弹出队首\n// FIFO 先进先出'
};
let currentContainer = 'vector';
let vectorArr = [10, 20, 30];
let stackArr = [5, 15];
let queueArr = [7, 3, 9];

function renderContainer() {
  const view = document.getElementById('container-view');
  view.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'container-label';
  label.textContent = currentContainer;
  view.appendChild(label);

  let arr = currentContainer === 'vector' ? vectorArr : (currentContainer === 'stack' ? stackArr : queueArr);
  if (arr.length === 0) {
    const e = document.createElement('div');
    e.className = 'elem empty-msg';
    e.textContent = '（空）';
    view.appendChild(e);
  } else {
    arr.forEach((v, i) => {
      const e = document.createElement('div');
      e.className = 'elem';
      if (currentContainer === 'vector') e.classList.add('vec');
      if (currentContainer === 'stack' && i === arr.length - 1) {
        e.classList.add('stack-top');
        e.innerHTML = v + '<span class="pointer-mark">▲ 栈顶</span>';
      } else if (currentContainer === 'queue') {
        if (i === 0) { e.classList.add('queue-front'); e.innerHTML = v + '<span class="pointer-mark">队首</span>'; }
        else if (i === arr.length - 1) { e.classList.add('queue-back'); e.innerHTML = v + '<span class="pointer-mark">队尾</span>'; }
        else e.textContent = v;
      } else {
        e.textContent = v;
      }
      view.appendChild(e);
    });
  }
  const rawCode = CODES[currentContainer];
  const escCode = rawCode.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  document.getElementById('code-display').innerHTML = escCode.replace(/\/\/[^\n]*/g, m => '<span class="comment">' + m + '</span>')
    .replace(/\b(include|vector|stack|queue|int|void)\b/g, '<span class="type">$1</span>')
    .replace(/\b(push_back|pop_back|push|pop|top|front|sort)\b/g, '<span class="kw">$1</span>');

  const info = document.getElementById('info-bar');
  if (currentContainer === 'vector') {
    info.innerHTML = '<div class="info-item">v.size(): <strong>' + vectorArr.length + '</strong></div>'
      + '<div class="info-item">v.front(): <strong>' + (vectorArr.length ? vectorArr[0] : '-') + '</strong></div>'
      + '<div class="info-item">v.back(): <strong>' + (vectorArr.length ? vectorArr[vectorArr.length-1] : '-') + '</strong></div>';
  } else if (currentContainer === 'stack') {
    info.innerHTML = '<div class="info-item">s.size(): <strong>' + stackArr.length + '</strong></div>'
      + '<div class="info-item">s.top(): <strong>' + (stackArr.length ? stackArr[stackArr.length-1] : '-') + '</strong></div>'
      + '<div class="info-item">s.empty(): <strong>' + (stackArr.length === 0) + '</strong></div>';
  } else {
    info.innerHTML = '<div class="info-item">q.size(): <strong>' + queueArr.length + '</strong></div>'
      + '<div class="info-item">q.front(): <strong>' + (queueArr.length ? queueArr[0] : '-') + '</strong></div>'
      + '<div class="info-item">q.back(): <strong>' + (queueArr.length ? queueArr[queueArr.length-1] : '-') + '</strong></div>';
  }
}

function pushOp() {
  const v = parseInt(document.getElementById('value-input').value) || 0;
  if (currentContainer === 'vector') vectorArr.push(v);
  else if (currentContainer === 'stack') stackArr.push(v);
  else queueArr.push(v);
  renderContainer();
}

function popOp() {
  if (currentContainer === 'vector') vectorArr.pop();
  else if (currentContainer === 'stack') stackArr.pop();
  else queueArr.shift();
  renderContainer();
}

function sortOp() {
  if (currentContainer === 'vector') vectorArr.sort((a, b) => a - b);
  else if (currentContainer === 'stack') stackArr.sort((a, b) => a - b);
  else queueArr.sort((a, b) => a - b);
  renderContainer();
}

function selectContainer(name) {
  currentContainer = name;
  document.querySelectorAll('#container-buttons .ctrl-btn').forEach((b, i) => b.classList.toggle('active', CONTAINERS[i] === name));
  renderContainer();
}

function init() {
  const btnBox = document.getElementById('container-buttons');
  CONTAINERS.forEach(name => {
    const b = document.createElement('button');
    b.className = 'ctrl-btn' + (name === 'vector' ? ' active' : '');
    b.textContent = name;
    b.onclick = () => selectContainer(name);
    btnBox.appendChild(b);
  });
  renderContainer();
}

init();
</script>

  <div class="next-link">
    <a href="strings.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>上一页：字符串</a>
    <a href="sorting.html">下一页：排序算法<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
  </div>

<script>
(function() {
  const key = 'c-workshop-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('c-workshop-theme', 'dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('c-workshop-theme', 'light');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}
</script>
</body>
</html>
