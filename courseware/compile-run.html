<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编译运行流程 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff; --orange: #ff9100; --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa; --red: #ff4757; --py: #f7df1e; }
  body { font-size: 17px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--cyan), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .workspace { max-width: 1100px; margin: 0 auto; }
  .topic-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .topic-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .topic-btn:hover { border-color: var(--accent); }
  .topic-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }
  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-body { padding: 20px; }
  .tip-box { padding: 14px 18px; background: rgba(0,229,255,0.06); border: 1px solid rgba(0,229,255,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
  .tip-box .tip-text strong { color: var(--text); }
  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
  .term { border-bottom: 2px dotted var(--accent2); cursor: help; color: var(--accent2); font-weight: 600; position: relative; }
  .term:hover { background: rgba(108,92,231,0.12); border-radius: 3px; }
  .term-card { position: fixed; z-index: 9999; width: 340px; max-width: 90vw; background: var(--surface2); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 32px rgba(108,92,231,0.25); display: none; pointer-events: none; }
  .term-card.show { display: block; animation: termFadeIn 0.18s ease-out; }
  @keyframes termFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .term-card .tc-title { font-size: 0.82rem; font-weight: 700; color: var(--cyan); margin-bottom: 6px; }
  .term-card .tc-body { font-size: 0.8rem; color: var(--text-dim); line-height: 1.7; }
  .term-card .tc-body strong { color: var(--text); }
  .term-card .tc-body code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--orange); background: rgba(255,145,0,0.08); padding: 1px 5px; border-radius: 3px; }
  .term-card .tc-icon { font-size: 1.1rem; margin-bottom: 4px; }
  .next-link { display: flex; justify-content: space-between; margin-top: 24px; }
  .next-link a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .next-link a:hover { border-color: var(--accent); color: var(--text); }
  .next-link a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .flow-step { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; transition: all 0.3s; cursor: pointer; }
  .flow-step:hover { border-color: var(--accent); background: rgba(108,92,231,0.08); }
  .flow-step.active { border-color: var(--accent); background: rgba(108,92,231,0.12); }
  .flow-step .fs-num { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
  .flow-step .fs-content { flex: 1; }
  .flow-step .fs-title { font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .flow-step .fs-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.5; }
  .flow-arrow { text-align: center; color: var(--text-dim); font-size: 1.2rem; margin: 2px 0; }
  .compare-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.78rem; }
  .compare-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .compare-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,90,0.5); }
  .compare-table .py-col { color: var(--py); }
  .compare-table .cpp-col { color: var(--cyan); }
  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.7; color: var(--text); white-space: pre; overflow-x: auto; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-top: 8px; }
  .code-block .kw { color: var(--accent2); } .code-block .str { color: var(--green); } .code-block .comment { color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html" class="back-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
  <h1>编译运行流程</h1>
  <span class="sub">.cpp → .exe → 运行 · 编译错误 vs 运行错误</span>
</div>
<div class="workspace">
  <div class="topic-nav" id="topic-nav"></div>
  <div class="main-grid">
    <div class="panel">
      <div class="panel-header"><span class="label">流程图</span></div>
      <div class="panel-body"><div id="vis-content"></div></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="label">关键知识</span></div>
      <div class="panel-body"><div id="knowledge-content"></div></div>
    </div>
  </div>
  <div class="next-link">
    <a href="binary-basics.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>上一页：二进制基础</a>
    <a href="semicolon-braces.html">下一页：分号与花括号<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
  </div>
</div>
<script>
const TOPICS = [
  {
    name: '编译三步',
    vis: `
      <div id="flow-container">
        <div class="flow-step" onclick="showStep(0)"><div class="fs-num">1</div><div class="fs-content"><div class="fs-title">预处理（Preprocess）</div><div class="fs-desc">处理 #include 等指令，把头文件内容粘贴进来</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step" onclick="showStep(1)"><div class="fs-num">2</div><div class="fs-content"><div class="fs-title">编译（Compile）</div><div class="fs-desc">把 C++ 代码翻译成汇编语言，再变成机器码</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step" onclick="showStep(2)"><div class="fs-num">3</div><div class="fs-content"><div class="fs-title">链接（Link）</div><div class="fs-desc">把多个文件和库拼成最终的可执行文件 .exe</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step" onclick="showStep(3)"><div class="fs-num">4</div><div class="fs-content"><div class="fs-title">运行（Run）</div><div class="fs-desc">操作系统把 .exe 加载到内存，CPU 执行</div></div></div>
      </div>
      <div id="step-detail" style="margin-top:16px; padding:14px; background:rgba(108,92,231,0.08); border-radius:8px; font-size:0.82rem; color:var(--accent2); line-height:1.6;">👆 点击步骤查看详情</div>
    `,
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 C++ 代码到运行的完整流程</div>
        <div class="tip-text">
          <strong>① 预处理</strong>：处理 <code>#include</code>（粘贴头文件）、<code>#define</code>（替换文本）<br>
          <strong>② 编译</strong>：C++ → 汇编 → 机器码（0 和 1）<br>
          <strong>③ 链接</strong>：把你的代码和标准库拼接成 <code>.exe</code><br>
          <strong>④ 运行</strong>：加载到内存，CPU 执行<br><br>
          平时我们用 <code>g++ hello.cpp -o hello</code> 一条命令完成前三步。
        </div>
      </div>
      <div class="tip-box">
        <div class="tip-label">💡 Python 跳过了编译</div>
        <div class="tip-text">
          Python 是<span class="term" data-term="interpreted">解释型语言</span>：<br>
          <code>python hello.py</code> → 直接在内存里逐行执行<br><br>
          C++ 是<span class="term" data-term="compiled">编译型语言</span>：<br>
          <code>g++ hello.cpp -o hello</code> → 编译<br>
          <code>./hello</code> → 运行<br><br>
          编译需要时间，但运行速度快得多。
        </div>
      </div>
    `
  },
  {
    name: '编译错误 vs 运行错误',
    vis: `
      <div style="padding:16px;">
        <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:12px;">两种错误的区别：</div>
        <div style="padding:14px; background:rgba(255,71,87,0.08); border:1px solid rgba(255,71,87,0.2); border-radius:8px; margin-bottom:12px;">
          <div style="font-size:0.82rem; font-weight:700; color:var(--red); margin-bottom:6px;">❌ 编译错误（Compile Error）</div>
          <div style="font-size:0.75rem; color:var(--text-dim); line-height:1.7;">语法有问题，编译器拒绝翻译。<br>不会生成 .exe，程序根本跑不起来。<br><br>例如：漏了分号、拼错关键字、类型不匹配</div>
        </div>
        <div style="padding:14px; background:rgba(255,145,0,0.08); border:1px solid rgba(255,145,0,0.2); border-radius:8px;">
          <div style="font-size:0.82rem; font-weight:700; color:var(--orange); margin-bottom:6px;">⚠️ 运行错误（Runtime Error）</div>
          <div style="font-size:0.75rem; color:var(--text-dim); line-height:1.7;">编译通过了，但运行时崩溃。<br>程序跑到一半出问题。<br><br>例如：除以 0、数组越界、访问空指针</div>
        </div>
      </div>
    `,
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 编译错误 = 语法问题</div>
        <div class="tip-text">
          编译器像语法检查器：如果你漏了 <code>;</code>、写了 <code>itn</code> 而不是 <code>int</code>，编译器会说"看不懂"，拒绝生成 .exe。<br><br>
          <strong>Python 没有编译阶段</strong>，所以 Python 的语法错误要等运行到那一行才发现。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 运行错误更可怕</div>
        <div class="danger-text">
          编译通过不代表程序正确！<br><br>
          <code>int a = 0; int b = 10 / a;</code> → 编译通过，但运行时<strong>除以 0</strong>崩溃。<br><br>
          Python 会报 <code>ZeroDivisionError</code>，C++ 会<strong>直接闪退</strong>或产生垃圾值。
        </div>
      </div>
    `
  },
  {
    name: '竞赛中的编译',
    vis: `
      <div style="padding:16px;">
        <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:12px;">在线评测系统（OJ）的流程：</div>
        <div class="flow-step"><div class="fs-num">1</div><div class="fs-content"><div class="fs-title">你提交 .cpp 源码</div><div class="fs-desc">在网站上粘贴代码或上传文件</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step"><div class="fs-num">2</div><div class="fs-content"><div class="fs-title">OJ 自动编译</div><div class="fs-desc">服务器用 g++ 编译你的代码</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step"><div class="fs-num">3</div><div class="fs-content"><div class="fs-title">OJ 运行测试</div><div class="fs-desc">用多组数据测试你的程序</div></div></div>
        <div class="flow-arrow">↓</div>
        <div class="flow-step"><div class="fs-num">4</div><div class="fs-content"><div class="fs-title">返回结果</div><div class="fs-desc">AC(通过) / WA(答案错) / TLE(超时) / RE(运行错误)</div></div></div>
      </div>
    `,
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 竞赛中你只需要提交源码</div>
        <div class="tip-text">
          竞赛中<strong>不需要你自己编译</strong>。你在 OJ 网站上提交 <code>.cpp</code> 文件，服务器自动编译运行。<br><br>
          你需要做的是：<br>
          ① 写正确的代码（不要编译错误）<br>
          ② 算法正确（不要 WA）<br>
          ③ 速度够快（不要 TLE）<br>
          ④ 不要崩溃（不要 RE）
        </div>
      </div>
      <table class="compare-table">
        <tr><th>结果</th><th>含义</th><th>原因</th></tr>
        <tr><td style="color:var(--green);">AC</td><td>Accepted 通过</td><td>全部测试数据正确</td></tr>
        <tr><td style="color:var(--red);">WA</td><td>Wrong Answer 答案错</td><td>算法逻辑有 bug</td></tr>
        <tr><td style="color:var(--orange);">TLE</td><td>Time Limit 超时</td><td>算法太慢</td></tr>
        <tr><td style="color:var(--pink);">RE</td><td>Runtime Error 运行错</td><td>除零、越界、爆栈</td></tr>
        <tr><td style="color:var(--red);">CE</td><td>Compile Error 编译错</td><td>语法错误</td></tr>
      </table>
    `
  }
];

let currentIdx = 0;

function showStep(idx) {
  const details = [
    '① 预处理：编译器找到 #include <iostream>，把 iostream 头文件的全部内容"粘贴"到你代码开头。还处理 #define 等指令。这一步只做文本替换。',
    '② 编译：把预处理后的 C++ 代码翻译成汇编语言（人类可读的机器指令），再翻译成二进制机器码。这一步检查语法错误。',
    '③ 链接：你的代码用到了 cout、cin 等标准库函数。链接器把你的代码和标准库拼接在一起，生成完整的可执行文件 .exe。',
    '④ 运行：操作系统把 .exe 从硬盘加载到内存，CPU 开始逐条执行机器指令。cout 把文字输出到显示器。'
  ];
  document.getElementById('step-detail').textContent = details[idx];
  document.querySelectorAll('.flow-step').forEach((s, i) => s.classList.toggle('active', i === idx));
}

function renderTopic(idx) {
  const topic = TOPICS[idx];
  document.querySelectorAll('.topic-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('vis-content').innerHTML = topic.vis;
  document.getElementById('knowledge-content').innerHTML = topic.knowledge;
  initTerms();
}

function init() {
  const nav = document.getElementById('topic-nav');
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => renderTopic(i);
    nav.appendChild(btn);
  });
  renderTopic(0);
}

const TERM_DEFS = {
  'interpreted': { icon: '🐍', title: '解释型语言', body: '运行时逐行翻译。Python、JavaScript。<br>优点：方便调试，改完直接跑。<br>缺点：速度慢。' },
  'compiled': { icon: '⚡', title: '编译型语言', body: '运行前整体翻译成机器码。C、C++、Rust。<br>优点：运行速度快。<br>缺点：每次改代码都要重新编译。' }
};

function initTerms() {
  let ct = null, cc = null;
  function show(t) { if (t===ct&&cc) return; hide(); ct=t; const d=TERM_DEFS[t.dataset.term]; if(!d) return; cc=document.createElement('div'); cc.className='term-card show'; cc.innerHTML='<div class="tc-icon">'+d.icon+'</div><div class="tc-title">'+d.title+'</div><div class="tc-body">'+d.body+'</div>'; document.body.appendChild(cc); const r=t.getBoundingClientRect(); let l=r.left+r.width/2-170, p=r.bottom+8; if(l+340>innerWidth)l=innerWidth-350; if(p+200>innerHeight)p=r.top-208; if(l<10)l=10; cc.style.left=l+'px'; cc.style.top=p+'px'; }
  function hide() { if(cc){cc.remove();cc=null;} ct=null; }
  document.addEventListener('mouseover', e => { const t=e.target.closest('.term'); if(t) show(t); else if(!e.target.closest('.term-card')) hide(); });
}

init();
</script>
</body>
</html>
