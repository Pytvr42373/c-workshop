<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a;
    --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00e676; --cyan: #00e5ff; --orange: #ff9100;
    --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --card-shadow: rgba(108, 92, 231, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-size: 17px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,230,118,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0,229,255,0.04) 0%, transparent 50%);
    z-index: -1; animation: bgShift 20s ease-in-out infinite alternate;
  }
  @keyframes bgShift { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(-2%, -1%) rotate(3deg); } }
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
  header { text-align: center; margin-bottom: 60px; }
  .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; background: rgba(108,92,231,0.15); border: 1px solid rgba(108,92,231,0.3); font-size: 0.75rem; color: var(--accent2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  h1 { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2; margin-bottom: 12px; }
  .subtitle { font-size: 1.05rem; color: var(--text-dim); max-width: 560px; margin: 0 auto; line-height: 1.7; }
  .subtitle strong { color: var(--accent2); -webkit-text-fill-color: var(--accent2); }
  .stats-bar { display: flex; justify-content: center; gap: 40px; margin-top: 28px; flex-wrap: wrap; }
  .stat-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-dim); }
  .stat-item .num { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--accent2); }
  .stat-item .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--green); } .dot.cyan { background: var(--cyan); } .dot.orange { background: var(--orange); } .dot.pink { background: var(--pink); }
  .section-header { grid-column: 1 / -1; margin: 16px 0 8px; padding: 0; }
  .section-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .section-header .section-sub { font-size: 0.78rem; color: var(--text-dim); }
  .section-header .section-line { height: 2px; background: linear-gradient(90deg, var(--accent), transparent); margin-top: 10px; border-radius: 2px; opacity: 0.4; }
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  .course-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .course-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--green)); opacity: 0; transition: opacity 0.3s; }
  .course-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 40px var(--card-shadow); }
  .course-card:hover::before { opacity: 1; }
  .card-number { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 1px; }
  .card-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 16px; }
  .icon-purple { background: rgba(108,92,231,0.15); } .icon-green { background: rgba(0,230,118,0.15); } .icon-cyan { background: rgba(0,229,255,0.15); } .icon-orange { background: rgba(255,145,0,0.15); } .icon-pink { background: rgba(255,64,129,0.15); }
  .course-card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .course-card p { font-size: 0.82rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 3px 10px; border-radius: 6px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.3px; }
  .tag-purple { background: rgba(108,92,231,0.12); color: var(--accent2); } .tag-green { background: rgba(0,230,118,0.12); color: var(--green); } .tag-cyan { background: rgba(0,229,255,0.12); color: var(--cyan); } .tag-orange { background: rgba(255,145,0,0.12); color: var(--orange); } .tag-pink { background: rgba(255,64,129,0.12); color: var(--pink); }
  .card-arrow { position: absolute; bottom: 24px; right: 24px; width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; transition: all 0.3s; opacity: 0.5; }
  .course-card:hover .card-arrow { opacity: 1; background: var(--accent); transform: translateX(4px); }
  .card-arrow svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  footer { text-align: center; margin-top: 60px; padding-top: 30px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-dim); }
  @media (max-width: 640px) { h1 { font-size: 2rem; } .container { padding: 24px 16px 60px; } .course-grid { grid-template-columns: 1fr; } .stats-bar { gap: 20px; } }
[data-theme="light"] {
  --bg: #f0f4ff; --surface: #ffffff; --surface2: #e8edf5; --border: #d0d8e8;
  --accent: #5b4bd4; --accent2: #7c6df0; --green: #00b86b; --cyan: #0099cc;
  --orange: #e67e00; --pink: #d6336c; --red: #d93025; --yellow: #e6a800;
  --text: #1a1d3a; --text-dim: #6b6f8a;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">Interactive Lab</div>
    <h1>C 语言交互实验室</h1>
    <p class="subtitle">从 Python 到 C，<strong>看见</strong>内存里发生的一切。<br>每个课件都是一个可交互的"内存显微镜"。</p>
    <div class="stats-bar">
      <div class="stat-item"><span class="dot green"></span><span class="num" id="course-count">27</span><span>个交互课件</span></div>
      <div class="stat-item"><span class="dot cyan"></span><span>点击 · 拖拽 · 观察</span></div>
      <div class="stat-item"><span class="dot orange"></span><span>零依赖 · 打开即用</span></div>
    </div>
    <button id="theme-toggle" style="margin-top:16px;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:1rem;color:var(--text-dim);transition:all 0.2s;" onclick="toggleTheme()" title="切换主题">🌙</button>
  </header>
  <div class="course-grid" id="course-grid"></div>
  <footer>从 Python 到 C · 看见内存 · 理解本质</footer>
</div>
<script>
const SECTIONS = [
  { title: '🖥️ 计算机基础（完全零基础从这里开始）', sub: '计算机怎么工作？内存是什么？为什么 C++ 要编译？', lineColor: 'var(--cyan)' },
  { icon: '🖥️', iconClass: 'icon-cyan', title: '计算机硬件与内存', desc: 'CPU、内存、硬盘、输入输出是什么？变量存在哪？为什么 C++ 有指针而 Python 没有？', tags: ['CPU', '内存', '硬件'], tagClass: 'tag-cyan', file: 'courseware/hardware-memory.html' },
  { icon: '🔢', iconClass: 'icon-cyan', title: '二进制与数据表示', desc: '0 和 1、位与字节、为什么 int 是 4 字节？点击位切换看十进制变化。', tags: ['二进制', '字节', '数据类型'], tagClass: 'tag-cyan', file: 'courseware/binary-basics.html' },
  { icon: '⚙️', iconClass: 'icon-cyan', title: '编译运行流程', desc: '.cpp 怎么变成 .exe？预处理→编译→链接→运行。编译错误 vs 运行错误。', tags: ['编译', '链接', 'OJ'], tagClass: 'tag-cyan', file: 'courseware/compile-run.html' },
  { title: '🐍 Python → C++ 语法过渡（你已经会 Python，这些是不同的地方）', sub: '分号、花括号、声明类型、布尔值大小写——最容易踩坑的区别', lineColor: 'var(--accent2)' },
  { icon: '❗', iconClass: 'icon-purple', title: '分号与花括号', desc: 'C++ 每句要加分号 ; ，代码块用 {} 不用缩进。初学者最高频的编译错误。', tags: ['分号', '花括号', '编译错误'], tagClass: 'tag-purple', file: 'courseware/semicolon-braces.html' },
  { icon: '📋', iconClass: 'icon-purple', title: '变量声明 vs 赋值', desc: 'C++ 必须先声明类型（int x = 10），Python 随用随赋（x = 10）。为什么？', tags: ['声明', '类型', '静态类型'], tagClass: 'tag-purple', file: 'courseware/declare-vs-assign.html' },
  { icon: '💬', iconClass: 'icon-purple', title: '注释规范', desc: 'Python 用 # ，C++ 用 // 和 /* */ 。Ctrl+/ 快捷键注释。', tags: ['注释', '//', '/* */'], tagClass: 'tag-purple', file: 'courseware/comments.html' },
  { icon: '⚖️', iconClass: 'icon-pink', title: '布尔值与比较运算', desc: 'C++ 用 true/false（小写！），逻辑用 && || ! 不是 and or not。', tags: ['bool', 'true/false', '逻辑运算'], tagClass: 'tag-pink', file: 'courseware/bool-compare.html' },
  { icon: '📦', iconClass: 'icon-purple', title: '头文件详解', desc: '#include 是什么？<iostream> vs <cstdio>？尖括号 vs 双引号？点击代码逐行查看解释。', tags: ['#include', '预处理', '头文件'], tagClass: 'tag-purple', file: 'courseware/headers.html' },
  { icon: '🏷️', iconClass: 'icon-purple', title: '命名空间详解', desc: 'using namespace std 是什么？std:: 前缀可以省吗？为什么需要命名空间？和 Python import 对比。', tags: ['namespace', 'std', '命名冲突'], tagClass: 'tag-purple', file: 'courseware/namespace.html' },
  { icon: '⬅️', iconClass: 'icon-green', title: 'cin / cout 详解', desc: '>> 和 << 的方向、cin 自动分隔、endl vs \\n、缓冲区、速度优化。点击代码逐行讲解。', tags: ['cin', 'cout', '流'], tagClass: 'tag-green', file: 'courseware/cin-cout.html' },
  { icon: '⌨️', iconClass: 'icon-orange', title: 'scanf / printf 详解', desc: '%d %f %lf %c %s 格式控制、& 取地址、宽度对齐精度、竞赛中的速度优势。逐行讲解。', tags: ['scanf', 'printf', '格式控制'], tagClass: 'tag-orange', file: 'courseware/scanf-printf.html' },
  { icon: '🐍➜⚡', iconClass: 'icon-purple', title: 'Python → C++ 综合对比', desc: '从 Python 出发快速上手 C++：输入输出、数据类型、条件判断，左右对比一目了然。', tags: ['过渡', '对比', '综合'], tagClass: 'tag-purple', file: 'courseware/python-to-cpp.html' },
  { title: '📖 零基础入门 · GESP 1级', sub: 'C++ 语法核心：变量、运算、输入输出、分支、循环', lineColor: 'var(--accent)' },
  { icon: '🏗️', iconClass: 'icon-purple', title: 'C++ 程序结构基础', desc: '#include 是什么？using namespace std 干嘛的？main 函数怎么来的？编译和运行有什么区别？', tags: ['头文件', '命名空间', '编译流程'], tagClass: 'tag-purple', file: 'courseware/cpp-basics.html' },
  { icon: '🧩', iconClass: 'icon-purple', title: '变量与数据类型', desc: 'int / long long / float / double / char / bool，每种类型占多大内存？范围是多少？', tags: ['类型系统', '内存大小', 'GESP 1级'], tagClass: 'tag-purple', file: 'courseware/variables.html' },
  { icon: '➕➖', iconClass: 'icon-orange', title: '算术运算与赋值', desc: '加减乘除、取模、复合赋值、类型转换、自增自减，C++ 运算的完整细节。', tags: ['运算符', '类型转换', 'GESP 1级'], tagClass: 'tag-orange', file: 'courseware/arithmetic.html' },
  { icon: '⌨️', iconClass: 'icon-orange', title: '输入输出', desc: 'cin/cout 与 scanf/printf 的格式控制、宽度对齐、小数精度、竞赛常用技巧。', tags: ['printf', 'scanf', 'GESP 1级'], tagClass: 'tag-orange', file: 'courseware/stdio.html' },
  { icon: '🎮', iconClass: 'icon-purple', title: '分支结构', desc: 'if-else if-else、switch-case、条件表达式、多层嵌套，单步执行看条件怎么走。', tags: ['条件', '分支', 'GESP 1级'], tagClass: 'tag-purple', file: 'courseware/control-flow.html' },
  { icon: '🔄⚡', iconClass: 'icon-cyan', title: '循环与运算符', desc: 'i++ 与 ++i 的区别、for/while/do-while 执行流程、break/continue、嵌套循环，单步执行看清楚每一步。', tags: ['自增自减', '循环细节', 'GESP 1级'], tagClass: 'tag-cyan', file: 'courseware/cpp-loops-and-ops.html' },
  { title: '📐 进阶语法 · GESP 2级', sub: '数组、字符、字符串、函数、结构体、作用域', lineColor: 'var(--green)' },
  { icon: '📊', iconClass: 'icon-green', title: '数组', desc: '一排连续的内存格子。索引就是偏移量，鼠标悬停看地址，理解 arr[i] 的本质。', tags: ['连续内存', '索引', 'GESP 2级'], tagClass: 'tag-green', file: 'courseware/arrays.html' },
  { icon: '🔤', iconClass: 'icon-orange', title: 'ASCII 码与字符', desc: 'char 本质是数字！A=65，a=97。大小写转换、字符运算、点击 ASCII 表查看。', tags: ['ASCII', 'char', '字符运算'], tagClass: 'tag-orange', file: 'courseware/ascii-char.html' },
  { icon: '📝', iconClass: 'icon-orange', title: '字符串', desc: 'C 语言没有字符串类型！每个字符占一格，末尾藏着 \\0。string 类操作函数。', tags: ['char[]', '\\0结尾', 'GESP 2级'], tagClass: 'tag-orange', file: 'courseware/strings.html' },
  { icon: '🔄', iconClass: 'icon-pink', title: '函数传参', desc: '值传递复制一份，引用传递指向同一份。看函数调用时栈帧里发生了什么。', tags: ['值传递', '引用传递', 'GESP 2级'], tagClass: 'tag-pink', file: 'courseware/functions.html' },
  { icon: '📦', iconClass: 'icon-pink', title: '结构体', desc: 'struct 自定义类型，嵌套结构体，内存对齐，typedef 简化，看内存布局一目了然。', tags: ['struct', '自定义类型', 'GESP 2级'], tagClass: 'tag-pink', file: 'courseware/structs.html' },
  { icon: '👁️', iconClass: 'icon-green', title: '作用域', desc: 'for 里的 i 出了循环就不见！全局变量 vs 局部变量，同名变量遮蔽。', tags: ['作用域', '全局', '局部'], tagClass: 'tag-green', file: 'courseware/scope.html' },
  { title: '⚙️ 算法入门 · GESP 3-4级', sub: '指针、排序、查找', lineColor: 'var(--orange)' },
  { icon: '🎯', iconClass: 'icon-cyan', title: '指针入门', desc: '& 取地址，* 解引用。指针就是一个箭头，指向内存里的某个位置。', tags: ['地址', '箭头', 'GESP 3级'], tagClass: 'tag-cyan', file: 'courseware/pointers.html' },
  { icon: '📡', iconClass: 'icon-green', title: '排序算法', desc: '冒泡 / 选择 / 插入排序，柱状图可视化，每一步比较和交换都看得清清楚楚。', tags: ['算法', '可视化', 'GESP 3级'], tagClass: 'tag-green', file: 'courseware/sorting.html' },
  { icon: '🔍', iconClass: 'icon-cyan', title: '查找算法', desc: '线性查找 vs 二分查找，动态输入目标值，看 left/right/mid 边界怎么移动。', tags: ['算法', '二分', 'GESP 3级'], tagClass: 'tag-cyan', file: 'courseware/searching.html' }
];
const grid = document.getElementById('course-grid');
let seq = 0;
SECTIONS.forEach(item => {
  if (item.sub) {
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = '<h2>' + item.title + '</h2><div class="section-sub">' + item.sub + '</div><div class="section-line" style="background:linear-gradient(90deg, ' + item.lineColor + ', transparent)"></div>';
    grid.appendChild(header);
  } else {
    seq++;
    const card = document.createElement('a');
    card.className = 'course-card';
    card.href = item.file;
    card.innerHTML = '<div class="card-number">' + String(seq).padStart(2, '0') + '</div><div class="card-icon ' + item.iconClass + '">' + item.icon + '</div><h2>' + item.title + '</h2><p>' + item.desc + '</p><div class="card-tags">' + item.tags.map(t => '<span class="tag ' + item.tagClass + '">' + t + '</span>').join('') + '</div><div class="card-arrow"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>';
    grid.appendChild(card);
  }
});
</script>

<script>
(function() {
  const key = 'c-workshop-theme';
  const saved = localStorage.getItem(key);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) {
    html.removeAttribute('data-theme');
    localStorage.setItem('c-workshop-theme', 'dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('c-workshop-theme', 'light');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}
</script>
</body>
</html>
